spring.application.name=chatmessenger
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/chat_messenger_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_MIN_256BIT
jwt.expiration-ms=86400000

file.upload-dir=./uploads

# File upload limits (module 8 - attachment)
#spring.servlet.multipart.max-file-size=25MB
#spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true